name: Check code formatting, clang-format 
on: [push, pull_request]
jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true # Caches uv's own metadata and environments

      - name: Run clang-format style check for C/C++
        run: |
            uvx clang-format@21 --version
            CLANG_FORMAT="uvx clang-format@21" scripts/run-clang-format.sh
            git diff --exit-code
